[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vending-automat"
version = "0.0.1"
description = "Symulator automatu z napojami (projekt z zaawansowanego programowania obiektowego)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vending*"]

[tool.pytest.ini_options]
testpaths = ["tests"]